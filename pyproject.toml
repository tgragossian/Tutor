[project]
name = "mathtutor"
version = "0.1.0"
description = "Calculus I tutor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic>=2.7",
    "pydantic-settings",
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "anthropic==2.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "hypothesis==6.168.3",
    "psutil==7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathtutor"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md", ".claude", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["mathtutor.domain", "mathtutor.domain.*", "mathtutor.content", "mathtutor.content.*", "mathtutor.verify", "mathtutor.verify.*", "mathtutor.store", "mathtutor.store.*"]
strict = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "mpmath", "mpmath.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
