[project]
name = "mathtutor"
version = "0.1.0"
description = "Calculus I tutor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic>=2.7",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathtutor"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md", ".claude", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["mathtutor.domain", "mathtutor.domain.*", "mathtutor.content", "mathtutor.content.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
