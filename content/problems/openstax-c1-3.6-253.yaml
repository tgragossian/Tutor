id: openstax-c1-3.6-253
topic: derivatives.chain_rule
difficulty: 3
source:
  book: OpenStax Calculus Volume 1
  section: '3.6'
  exercise: 253
  url: https://openstax.org/books/calculus-volume-1/pages/3-6-the-chain-rule
  license: CC BY-NC-SA 4.0
statement: 'The position function of a freight train is given by $s(t) = 100(t+1)^{-2}$, with $s$ in meters and $t$ in seconds. At time $t = 6$ s, find the train''s velocity in m/s. Give an exact answer or round to 3 decimal places.'
answer:
  kind: numeric
  latex: '-\frac{200}{343}'
  precision:
    decimals: 3
misconceptions:
  - '-\frac{200}{49}  # power rule applied without lowering the exponent'
review:
  status: human_verified
  reviewer: 'tg'
  date: '2026-10-15'
  notes: 'Exercise 253 has parts a (velocity), b (acceleration) and c (speeding up or slowing down); only part a is graded here. v(t) = s''(t) = 100 * (-2)(t+1)^(-3) * 1 = -200/(t+1)^3. v(6) = -200/7^3 = -200/343 = -0.58309... m/s (-0.583 to 3 decimals), matching the OpenStax answer key for 253a. Cross-checked with a throwaway SymPy diff and subs. 2026-10-20: R24 instruction added to the statement (Thomas approved the wording); answer unchanged.'
