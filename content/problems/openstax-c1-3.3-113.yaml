id: openstax-c1-3.3-113
topic: derivatives.basic_rules
difficulty: 2
source:
  book: OpenStax Calculus Volume 1
  section: '3.3'
  exercise: 113
  url: https://openstax.org/books/calculus-volume-1/pages/3-3-differentiation-rules
  license: CC BY-NC-SA 4.0
statement: 'Find $f''(x)$ for $f(x) = x^2\left(\frac{2}{x^2} + \frac{5}{x^3}\right)$.'
answer:
  kind: expression
  latex: '-\frac{5}{x^2}'
  variable: x
  domain:
    intervals: [['-inf', 'inf', open, open]]
    exclude: ['0']
misconceptions:
  - '\frac{5}{x^2}  # sign error: derivative of 1/x taken as +1/x^2'
  - '2x\left(-\frac{4}{x^3}-\frac{15}{x^4}\right)  # product of the derivatives'
review:
  status: human_verified
  reviewer: 'tg'
  date: '2026-10-22'
  notes: 'Group 106-117 instruction: find f''(x). Expand: f(x) = 2 + 5/x, so f''(x) = -5/x^2, matching the OpenStax answer key for 113 (-5/x^2). Domain: f is undefined at x = 0, so R minus {0}.'
