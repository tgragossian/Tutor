id: openstax-c1-3.6-215
topic: derivatives.chain_rule
difficulty: 2
source:
  book: OpenStax Calculus Volume 1
  section: '3.6'
  exercise: 215
  url: https://openstax.org/books/calculus-volume-1/pages/3-6-the-chain-rule
  license: CC BY-NC-SA 4.0
statement: 'Given $y = 6u^3$ and $u = 7x - 4$, find $\frac{dy}{dx}$ as a function of $x$.'
answer:
  kind: expression
  latex: '126(7x-4)^2'
  variable: x
misconceptions:
  - '18(7x-4)^2  # missing du/dx = 7'
  - '42(7x-4)^2  # forgot the factor 3 from the power rule'
review:
  status: needs_review
  reviewer: ''
  date: ''
  notes: 'Group 214-219 instruction: find dy/dx with Leibniz notation. dy/du = 18u^2, du/dx = 7, so dy/dx = 18(7x - 4)^2 * 7 = 126(7x - 4)^2, matching the OpenStax answer key for 215. Domain: all reals.'
