id: openstax-c1-3.5-193
topic: derivatives.trig
difficulty: 2
source:
  book: OpenStax Calculus Volume 1
  section: '3.5'
  exercise: 193
  url: https://openstax.org/books/calculus-volume-1/pages/3-5-derivatives-of-trigonometric-functions
  license: CC BY-NC-SA 4.0
statement: 'Find $\frac{d^2y}{dx^2}$ for $y = x - \frac{1}{2}\sin x$.'
answer:
  kind: expression
  latex: '\frac{1}{2}\sin(x)'
  variable: x
misconceptions:
  - '-\frac{1}{2}\sin(x)  # sign error in the second derivative of sin x'
  - '1-\frac{1}{2}\cos(x)  # stopped at the first derivative'
review:
  status: human_verified
  reviewer: 'tg'
  date: '2026-10-22'
  notes: 'Group 191-195 instruction. y'' = 1 - (1/2)cos x; y'''' = (1/2) sin x, matching the OpenStax answer key for 193. Domain: all reals.'
