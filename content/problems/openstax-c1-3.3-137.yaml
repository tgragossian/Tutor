id: openstax-c1-3.3-137
topic: derivatives.basic_rules
difficulty: 3
source:
  book: OpenStax Calculus Volume 1
  section: '3.3'
  exercise: 137
  url: https://openstax.org/books/calculus-volume-1/pages/3-3-differentiation-rules
  license: CC BY-NC-SA 4.0
statement: 'Find an equation of the tangent line to the graph of $f(x) = 2x^3 + 4x^2 - 5x - 3$ at $x = -1$. Enter the right-hand side of $y = \dots$.'
answer:
  kind: expression
  latex: '-7x-3'
  variable: x
misconceptions:
  - '-7x+4  # used f(-1) = 4 as the y-intercept'
  - '-7x  # left out the point entirely'
review:
  status: needs_review
  reviewer: ''
  date: ''
  notes: 'f(-1) = -2 + 4 + 5 - 3 = 4. f''(x) = 6x^2 + 8x - 5, so f''(-1) = 6 - 8 - 5 = -7. y - 4 = -7(x + 1) gives y = -7x - 3, matching the OpenStax answer key for 137. The graded answer is the right-hand side -7x - 3 (instruction added). Domain: all reals.'
