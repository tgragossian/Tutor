{% extends "base.html" %}
{% block title %}Create account · {{ app_name }}{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/register" class="stack">
  <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}"></label>
  <p class="hint">3–32 characters: letters, digits and underscores.</p>
  <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
  <p class="hint">8–128 characters.</p>
  <button type="submit">Create account</button>
</form>
<p>Already have one? <a href="/login">Sign in</a>.</p>
{% endblock %}
