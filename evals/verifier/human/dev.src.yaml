  category: tricky
  problem_id: openstax-c1-3.3-111
  latex: '270x^4+39(x+1)^{-2}'
  label: correct
  rationale: '39(x+1)^(-2) = 39/(x+1)^2; the only restriction, x != -1, is already excluded.'
