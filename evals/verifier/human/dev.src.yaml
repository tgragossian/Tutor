  category: error
  problem_id: openstax-c1-3.5-181
  latex: '(1-\sin x)^2-(x+\cos x)\sin x'
  label: incorrect
  rationale: 'd/dx(1 - sin x) taken as -sin x. At x = 0: 1 vs 0.'
  reviewer: 'pending'
- id: d-181-09
  family: openstax-c1-3.5-181
  category: error
  problem_id: openstax-c1-3.5-181
  latex: '(1+\sin x)(1-\sin x)-(x+\cos x)\cos x'
  label: incorrect
  rationale: 'd/dx cos x taken as +sin x; differs by 2 sin x(1 - sin x). At x = -pi/2: -4.'
