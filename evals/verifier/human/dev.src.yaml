# --- openstax-c1-3.5-181: dy/dx = (1 - sin x)^2 - (x + cos x)cos x on R ----------------
- id: d-181-01
  family: openstax-c1-3.5-181
  category: tricky
  problem_id: openstax-c1-3.5-181
  latex: '(1-\sin x)^2-x\cos x-\cos^2x'
  label: correct
  rationale: 'Second term distributed: (x + cos x)cos x = x cos x + cos^2 x.'
  reviewer: 'pending'
- id: d-181-02
  family: openstax-c1-3.5-181
  category: tricky
  problem_id: openstax-c1-3.5-181
  latex: '1-2\sin x+\sin^2x-x\cos x-\cos^2x'
  label: correct
  rationale: 'Fully expanded: (1 - sin x)^2 = 1 - 2 sin x + sin^2 x.'
  reviewer: 'pending'
- id: d-181-03
  family: openstax-c1-3.5-181
  category: tricky
  problem_id: openstax-c1-3.5-181
  latex: '(1-\sin x)(1-\sin x)-(x+\cos x)\cos x'
  label: correct
  rationale: 'Product rule u''v + uv'' left unsquared: (1 - sin x)(1 - sin x) = (1 - sin x)^2.'
  reviewer: 'pending'
- id: d-181-04
  family: openstax-c1-3.5-181
  category: tricky
  problem_id: openstax-c1-3.5-181
  latex: '1-2\sin x-\cos(2x)-x\cos x'
  label: correct
  rationale: 'Expanded, with sin^2 x - cos^2 x = -cos 2x (double angle).'
  reviewer: 'pending'
- id: d-181-05
  family: openstax-c1-3.5-181
  category: tricky
  problem_id: openstax-c1-3.5-181
  latex: '(1-\sin x)^2-\cos x(x+\cos x)'
  label: correct
  rationale: 'Read as written, cos x times (x + cos x): the answer with the factor moved first. (Compute Engine parses cos(x(x + cos x)); see the review note.)'
  reviewer: 'pending'
- id: d-181-06
  family: openstax-c1-3.5-181
  category: error
  problem_id: openstax-c1-3.5-181
  latex: '(1-\sin x)^2+(x+\cos x)\cos x'
  label: incorrect
  rationale: 'Seed misconception: d/dx(-sin x) taken as +cos x. At x = 0: 2 vs 0.'
  reviewer: 'pending'
- id: d-181-07
  family: openstax-c1-3.5-181
  category: error
  problem_id: openstax-c1-3.5-181
  latex: '-(1-\sin x)\cos x'
  label: incorrect
  rationale: 'Product of the derivatives u''v'' = (1 - sin x)(-cos x). At x = 0: -1 vs 0.'
