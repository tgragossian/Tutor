# Human verifier dev cases (spec 08, task 9). Source for dev.jsonl:
#   npm run capture:eval --prefix tools
# Single-quoted LaTeX only. One input per case: latex (set on a real MathLive field), keys
# (pressed one by one, for real placeholder shapes) or choice_id. `category` is the spec 08
# coverage bucket; it is copied into dev.jsonl and the dev gate checks its minimums.
# Labels are fixed by the mathematics on the problem's stored domain, never by the verifier.
# reviewer: 'pending' until Thomas reviews (then 'tg').

# --- openstax-c1-3.3-111: f'(x) = 270x^4 + 39/(x+1)^2 on R \ {-1} -----------------------
- id: d-111-01
