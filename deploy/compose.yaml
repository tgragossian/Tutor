# Production stack: the app is reachable only through Caddy on the compose network.
services:
  # One-shot: bring the SQLite schema up to date before the app starts.
  migrate:
    image: ${MATHTUTOR_IMAGE:-mathtutor:local}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - app_data:/data

  app:
    image: ${MATHTUTOR_IMAGE:-mathtutor:local}
    env_file: .env
    restart: unless-stopped
    volumes:
      - app_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No ports: 8000 must never be published (uvicorn trusts forwarded headers).

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
